<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practicals</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="reset.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body id="body">
    <h1 class="text-center mt-5">Array</h1>
    <hr class="container-fluid container-lg">
    <section class="container-fluid container-lg">
        <form id="myForm" class="row">
            <div class="col-6 d-flex flex-column">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" key="name"required>   
            </div>
            <div class="col-6 d-flex flex-column">
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="marketing">Marketing</option>
                    <option value="development">Development</option>
                    <option value="customerSupport">Customer Support</option>
                    <option value="hr">HR</option>
                </select>
            </div>
            <div class="col-6 d-flex flex-column">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="col-6">
                <label for="genderPicker">Gender</label>
                <div class="radio-wrapper d-flex">
                    <div class="form-check" id="genderPicker">
                    <input class="form-check-input radio" type="radio" id="male" name="gender" value="male" default="true">
                    <label class="form-check-label" for="male">
                        Male
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input radio" type="radio" id="female" name="gender" value="female" default="false">
                    <label class="form-check-label" for="female">
                        Female
                    </label>
                </div>
                </div>
            </div>
            <div class="col-12">
                <label for="hobbies">Hobbies</label>
                <textarea type="text" id="hobbies" name="hobbies" rows="10" cols="30" class="w-100" required></textarea>
            </div>
            <div class="col-12 text-end py-4">
                <button  class="btn btn-dark btn-lg px-4 fs-6 fw-light" type="submit" role="submit">Submit</button>
            </div>
        </form>
        <table id="table" class="w-100">
            <tbody id="myTable">
                <tr class="bg-light fw-bold text-dark">
                    <th class="py-2 px-3">NAME</th>
                    <th class="py-2 px-3">DEPARTMENT</th>
                    <th class="py-2 px-3">DOB</th>
                    <th class="py-2 px-3">GENDER</th>
                    <th class="py-2 px-3">HOBBIES</th>
                    <th class="py-2 px-3">ACTIONS</th>
                </tr>
            </tbody>
        </table>
    </section>
    <div id="modal" class="">

    </div>
    <script src="array.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
