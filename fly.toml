app = 'quran-reader'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'
  DB_PATH = '/data/quran.db'
  STATIC_DIR = '/app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = 'quran_data'
  destination = '/data'
