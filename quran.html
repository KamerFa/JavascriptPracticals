<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran — Arabic &amp; Bosnian</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0b08;
  --bg-card: #1a1611;
  --bg-sidebar: #141210;
  --text: #e8dcc8;
  --text-muted: #9a8e7a;
  --gold: #c9a84c;
  --gold-dim: #8a7335;
  --green: #5a9e6f;
  --border: #2a2520;
  --accent: #c9a84c;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Lora', Georgia, serif;
  line-height: 1.6;
  min-height: 100vh;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  opacity: 0.03;
  pointer-events: none;
  z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Layout */
.app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 320px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
}

.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  font-family: 'Amiri', serif;
  color: var(--gold);
  font-size: 1.5rem;
  text-align: center;
  margin-bottom: 12px;
}

.search-box {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Lora', serif;
  font-size: 0.85rem;
  outline: none;
}
.search-box:focus { border-color: var(--gold-dim); }
.search-box::placeholder { color: var(--text-muted); }

.surah-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.surah-list::-webkit-scrollbar { width: 6px; }
.surah-list::-webkit-scrollbar-track { background: transparent; }
.surah-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.surah-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
}
.surah-item:hover { background: rgba(201,168,76,0.06); }
.surah-item.active {
  background: rgba(201,168,76,0.1);
  border-left-color: var(--gold);
}

.surah-num {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 0.75rem;
  color: var(--text-muted);
  flex-shrink: 0;
}

.surah-info { flex: 1; min-width: 0; }
.surah-name-ar {
  font-family: 'Amiri', serif;
  font-size: 1.05rem;
  color: var(--text);
  direction: rtl;
}
.surah-name-en {
  font-size: 0.78rem;
  color: var(--text-muted);
}

.surah-type-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.surah-type-dot.meccan { background: var(--gold); }
.surah-type-dot.medinan { background: var(--green); }

/* Main content */
.main {
  flex: 1;
  margin-left: 320px;
  padding: 32px 24px;
  max-width: 900px;
}

/* Surah header */
.surah-header {
  text-align: center;
  padding: 32px 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.surah-header-ar {
  font-family: 'Amiri', serif;
  font-size: 2.8rem;
  color: var(--gold);
  margin-bottom: 4px;
}
.surah-header-en {
  font-size: 1.1rem;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.surah-meta {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 0.82rem;
  color: var(--text-muted);
}
.surah-badge {
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.surah-badge.meccan { background: rgba(201,168,76,0.15); color: var(--gold); }
.surah-badge.medinan { background: rgba(90,158,111,0.15); color: var(--green); }

/* Bismillah */
.bismillah {
  text-align: center;
  font-family: 'Amiri', serif;
  font-size: 2rem;
  color: var(--gold);
  padding: 24px 0;
  opacity: 0.85;
}

/* Ayah */
.ayah {
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
}
.ayah:last-child { border-bottom: none; }

.ayah-num-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--gold-dim);
  border-radius: 50%;
  font-size: 0.8rem;
  color: var(--gold);
  margin-bottom: 12px;
}

.ayah-arabic {
  font-family: 'Amiri', serif;
  font-size: 1.75rem;
  line-height: 2.2;
  direction: rtl;
  text-align: right;
  color: var(--text);
  margin-bottom: 14px;
}

.ayah-bosnian {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.7;
  padding-left: 12px;
  border-left: 2px solid var(--border);
}

/* Navigation */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  padding: 32px 0;
  margin-top: 16px;
  border-top: 1px solid var(--border);
}
.nav-btn {
  padding: 10px 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Lora', serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.nav-btn:hover { border-color: var(--gold-dim); background: rgba(201,168,76,0.06); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn:disabled:hover { border-color: var(--border); background: var(--bg-card); }

/* Loading skeleton */
.skeleton {
  padding: 20px 0;
}
.skeleton-line {
  height: 16px;
  background: linear-gradient(90deg, var(--bg-card) 25%, #221e18 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 4px;
  margin-bottom: 12px;
}
.skeleton-line.wide { width: 100%; height: 28px; }
.skeleton-line.med { width: 75%; }
.skeleton-line.short { width: 50%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Mobile */
.mobile-header {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  align-items: center;
  justify-content: space-between;
}
.mobile-header h1 {
  font-family: 'Amiri', serif;
  color: var(--gold);
  font-size: 1.2rem;
}
.menu-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 10px;
  cursor: pointer;
  font-size: 1.1rem;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 99;
}

@media (max-width: 768px) {
  .mobile-header { display: flex; }
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.25s ease;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .main {
    margin-left: 0;
    padding: 72px 16px 32px;
  }
}

/* Scroll to top */
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 42px;
  height: 42px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--gold);
  font-size: 1.2rem;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  transition: opacity 0.2s;
}
.scroll-top.visible { display: flex; }
</style>
</head>
<body>

<div class="mobile-header">
  <h1>القرآن الكريم</h1>
  <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
</div>
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>القرآن الكريم</h1>
      <input type="text" class="search-box" id="search" placeholder="Search surah…">
    </div>
    <div class="surah-list" id="surahList"></div>
  </aside>

  <main class="main" id="main">
    <div id="content"></div>
  </main>
</div>

<button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

let currentSurah = 1;

// Build sidebar
function buildSidebar(filter = '') {
  const list = document.getElementById('surahList');
  list.innerHTML = '';
  const q = filter.toLowerCase();
  SURAHS.forEach(s => {
    if (q && !s.name.toLowerCase().includes(q) && !s.nameAr.includes(q) && !String(s.number).includes(q)) return;
    const div = document.createElement('div');
    div.className = 'surah-item' + (s.number === currentSurah ? ' active' : '');
    div.innerHTML = `
      <span class="surah-num">${s.number}</span>
      <div class="surah-info">
        <div class="surah-name-ar">${s.nameAr}</div>
        <div class="surah-name-en">${s.name}</div>
      </div>
      <span class="surah-type-dot ${s.type.toLowerCase()}"></span>
    `;
    div.onclick = () => loadSurah(s.number);
    list.appendChild(div);
  });
}

// Loading skeleton
function showLoading() {
  const content = document.getElementById('content');
  let html = '<div class="skeleton">';
  for (let i = 0; i < 8; i++) {
    const cls = i % 3 === 0 ? 'wide' : i % 3 === 1 ? 'med' : 'short';
    html += `<div class="skeleton-line ${cls}"></div>`;
  }
  html += '</div>';
  content.innerHTML = html;
}

// Fetch surah
async function fetchSurah(num) {
  if (cache.has(num)) return cache.get(num);
  const resp = await fetch(`https://api.alquran.cloud/v1/surah/${num}/editions/quran-uthmani,bs.mlivo`);
  if (!resp.ok) throw new Error('Failed to fetch surah');
  const json = await resp.json();
  const data = { arabic: json.data[0], bosnian: json.data[1] };
  cache.set(num, data);
  return data;
}

// Render surah
async function loadSurah(num) {
  currentSurah = num;
  const s = SURAHS[num - 1];
  buildSidebar(document.getElementById('search').value);
  showLoading();
  window.scrollTo({ top: 0 });

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');

  try {
    const data = await fetchSurah(num);
    const content = document.getElementById('content');
    const typeClass = s.type.toLowerCase();

    let html = `
      <div class="surah-header">
        <div class="surah-header-ar">${s.nameAr}</div>
        <div class="surah-header-en">${s.name}</div>
        <div class="surah-meta">
          <span class="surah-badge ${typeClass}">${s.type}</span>
          <span>Surah ${s.number}</span>
          <span>${s.ayahs} ayahs</span>
        </div>
      </div>
    `;

    // Bismillah (skip for At-Tawba and Al-Faatiha whose first ayah IS the bismillah)
    if (num !== 9 && num !== 1) {
      html += '<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>';
    }

    const arAyahs = data.arabic.ayahs;
    const bsAyahs = data.bosnian.ayahs;

    for (let i = 0; i < arAyahs.length; i++) {
      html += `
        <div class="ayah">
          <div class="ayah-num-badge">${arAyahs[i].numberInSurah}</div>
          <div class="ayah-arabic">${arAyahs[i].text}</div>
          <div class="ayah-bosnian">${bsAyahs[i].text}</div>
        </div>
      `;
    }

    // Nav buttons
    const prev = num > 1 ? num - 1 : null;
    const next = num < 114 ? num + 1 : null;
    html += `
      <div class="nav-buttons">
        <button class="nav-btn" ${prev ? `onclick="loadSurah(${prev})"` : 'disabled'}>← ${prev ? SURAHS[prev-1].name : ''}</button>
        <button class="nav-btn" ${next ? `onclick="loadSurah(${next})"` : 'disabled'}>${next ? SURAHS[next-1].name : ''} →</button>
      </div>
    `;

    content.innerHTML = html;
  } catch (err) {
    document.getElementById('content').innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--text-muted)">
        <p style="font-size:1.2rem;margin-bottom:12px">Failed to load surah</p>
        <p style="font-size:0.85rem">${err.message}</p>
        <button class="nav-btn" style="margin-top:20px" onclick="loadSurah(${num})">Retry</button>
      </div>
    `;
  }
}

// Search
document.getElementById('search').addEventListener('input', e => buildSidebar(e.target.value));

// Mobile sidebar toggle
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

// Scroll to top button
window.addEventListener('scroll', () => {
  document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 400);
});

// Init
buildSidebar();
loadSurah(1);
</script>
</body>
</html>
