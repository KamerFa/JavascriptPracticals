<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran — Chronological Order</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230d0b08'/><path d='M38 12a20 20 0 1 0 0 40 24 24 0 0 1 0-40z' fill='%23c9a84c'/><polygon points='22,24 23.5,29 28.5,29 24.5,32 26,37 22,34 18,37 19.5,32 15.5,29 20.5,29' fill='%23c9a84c'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@400;600;700&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0b08;
  --bg-card: #1a1611;
  --bg-sidebar: #141210;
  --text: #e8dcc8;
  --text-muted: #9a8e7a;
  --gold: #c9a84c;
  --gold-dim: #8a7335;
  --green: #5a9e6f;
  --border: #2a2520;
  --accent: #c9a84c;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Lora', Georgia, serif;
  line-height: 1.6;
  min-height: 100vh;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  opacity: 0.03;
  pointer-events: none;
  z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Layout */
.app {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 320px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
}

.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h1 {
  font-family: 'Amiri', serif;
  color: var(--gold);
  font-size: 1.5rem;
  text-align: center;
  margin-bottom: 12px;
}

.search-box {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Lora', serif;
  font-size: 0.85rem;
  outline: none;
}
.search-box:focus { border-color: var(--gold-dim); }
.search-box::placeholder { color: var(--text-muted); }

.surah-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.surah-list::-webkit-scrollbar { width: 6px; }
.surah-list::-webkit-scrollbar-track { background: transparent; }
.surah-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.surah-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
}
.surah-item:hover { background: rgba(201,168,76,0.06); }
.surah-item.active {
  background: rgba(201,168,76,0.1);
  border-left-color: var(--gold);
}

.surah-num {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 0.75rem;
  color: var(--text-muted);
  flex-shrink: 0;
}

.surah-info { flex: 1; min-width: 0; }
.surah-name-ar {
  font-family: 'Amiri', serif;
  font-size: 1.05rem;
  color: var(--text);
  direction: rtl;
}
.surah-name-en {
  font-size: 0.78rem;
  color: var(--text-muted);
}
.surah-mushaf-num {
  font-size: 0.65rem;
  color: var(--text-muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  flex-shrink: 0;
}

/* Filter buttons */
.filter-row {
  display: flex;
  gap: 6px;
  padding: 10px 16px 4px;
}
.filter-btn {
  flex: 1;
  padding: 5px 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-muted);
  font-family: 'Lora', serif;
  font-size: 0.72rem;
  cursor: pointer;
  transition: all 0.15s;
}
.filter-btn.active {
  background: rgba(201,168,76,0.12);
  border-color: var(--gold-dim);
  color: var(--gold);
}

.surah-type-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.surah-type-dot.meccan { background: var(--gold); }
.surah-type-dot.medinan { background: var(--green); }

/* Main content */
.main {
  flex: 1;
  margin-left: 320px;
  padding: 32px 24px;
  max-width: 900px;
}

/* Surah header */
.surah-header {
  text-align: center;
  padding: 32px 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.surah-header-ar {
  font-family: 'Amiri', serif;
  font-size: 2.8rem;
  color: var(--gold);
  margin-bottom: 4px;
}
.surah-header-en {
  font-size: 1.1rem;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.surah-meta {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 0.82rem;
  color: var(--text-muted);
}
.surah-badge {
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.surah-badge.meccan { background: rgba(201,168,76,0.15); color: var(--gold); }
.surah-badge.medinan { background: rgba(90,158,111,0.15); color: var(--green); }

.surah-header-label {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 4px;
}

/* Notes banner */
.notes-banner {
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 8px;
  padding: 10px 16px;
  margin-bottom: 20px;
  font-size: 0.82rem;
  color: var(--text-muted);
  text-align: center;
  font-style: italic;
}

/* Seerah panel */
.seerah-panel {
  background: rgba(201,168,76,0.04);
  border: 1px solid rgba(201,168,76,0.12);
  border-left: 3px solid var(--gold-dim);
  border-radius: 8px;
  margin-bottom: 20px;
  overflow: hidden;
}
.seerah-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.seerah-toggle:hover { background: rgba(201,168,76,0.06); }
.seerah-toggle-icon {
  font-size: 0.75rem;
  color: var(--gold-dim);
  transition: transform 0.25s;
}
.seerah-toggle-icon.rotated { transform: rotate(90deg); }
.seerah-toggle-title {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.85rem;
  color: var(--gold);
  letter-spacing: 0.05em;
}
.seerah-toggle-period {
  margin-left: auto;
  font-size: 0.72rem;
  color: var(--text-muted);
  font-style: italic;
}
.seerah-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.seerah-body.expanded { max-height: 2000px; }
.seerah-content {
  padding: 0 16px 16px;
}
.seerah-period-title {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.8rem;
  color: var(--gold-dim);
  margin-bottom: 6px;
  letter-spacing: 0.06em;
}
.seerah-period-years {
  font-size: 0.72rem;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.seerah-text {
  font-size: 0.85rem;
  color: var(--text);
  line-height: 1.7;
  margin-bottom: 12px;
}
.seerah-text.period-summary {
  color: var(--text-muted);
  font-style: italic;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
  margin-bottom: 12px;
}
.seerah-events {
  list-style: none;
  margin-bottom: 12px;
}
.seerah-events li {
  font-size: 0.8rem;
  color: var(--text-muted);
  padding: 3px 0 3px 16px;
  position: relative;
}
.seerah-events li::before {
  content: '\2726';
  position: absolute;
  left: 0;
  color: var(--gold-dim);
}
.seerah-ref {
  display: inline-block;
  font-size: 0.75rem;
  color: var(--gold-dim);
  text-decoration: none;
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 4px;
  padding: 4px 10px;
  transition: all 0.15s;
}
.seerah-ref:hover {
  background: rgba(201,168,76,0.08);
  color: var(--gold);
}
.seerah-lang-btns {
  display: flex;
  gap: 4px;
  margin-bottom: 10px;
}
.seerah-lang-btn {
  padding: 2px 10px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-muted);
  font-size: 0.7rem;
  cursor: pointer;
  font-family: 'Lora', serif;
}
.seerah-lang-btn.active {
  background: rgba(201,168,76,0.1);
  border-color: var(--gold-dim);
  color: var(--gold);
}

/* Language toggles */
.lang-toggles {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.lang-pill {
  padding: 6px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-muted);
  font-family: 'Lora', serif;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.lang-pill.active {
  background: rgba(201,168,76,0.12);
  border-color: var(--gold-dim);
  color: var(--gold);
}
.lang-pill:hover { border-color: var(--gold-dim); }

/* Bismillah */
.bismillah {
  text-align: center;
  font-family: 'Amiri', serif;
  font-size: 2rem;
  color: var(--gold);
  padding: 24px 0;
  opacity: 0.85;
}

/* Ayah */
.ayah {
  padding: 20px 0;
  border-bottom: 1px solid var(--border);
}
.ayah:last-child { border-bottom: none; }

.ayah-num-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--gold-dim);
  border-radius: 50%;
  font-size: 0.8rem;
  color: var(--gold);
  margin-bottom: 12px;
}

.ayah-arabic {
  font-family: 'Amiri', serif;
  font-size: 1.75rem;
  line-height: 2.2;
  direction: rtl;
  text-align: right;
  color: var(--text);
  margin-bottom: 14px;
}

.ayah-transliteration {
  font-size: 1.05rem;
  color: #d4c4a0;
  line-height: 1.8;
  font-style: italic;
  margin-top: 6px;
  margin-bottom: 4px;
}

.ayah-translation {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.7;
  padding-left: 12px;
  border-left: 2px solid var(--border);
  margin-top: 8px;
}
.ayah-translation .lang-label {
  font-family: 'IM Fell English SC', serif;
  font-size: 0.7rem;
  color: var(--gold-dim);
  letter-spacing: 0.05em;
  display: block;
  margin-bottom: 2px;
}

/* Navigation */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  padding: 32px 0;
  margin-top: 16px;
  border-top: 1px solid var(--border);
}
.nav-btn {
  padding: 10px 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Lora', serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.nav-btn:hover { border-color: var(--gold-dim); background: rgba(201,168,76,0.06); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }
.nav-btn:disabled:hover { border-color: var(--border); background: var(--bg-card); }

/* Loading skeleton */
.skeleton {
  padding: 20px 0;
}
.skeleton-line {
  height: 16px;
  background: linear-gradient(90deg, var(--bg-card) 25%, #221e18 50%, var(--bg-card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 4px;
  margin-bottom: 12px;
}
.skeleton-line.wide { width: 100%; height: 28px; }
.skeleton-line.med { width: 75%; }
.skeleton-line.short { width: 50%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Mobile */
.mobile-header {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  align-items: center;
  justify-content: space-between;
}
.mobile-header h1 {
  font-family: 'Amiri', serif;
  color: var(--gold);
  font-size: 1.2rem;
}
.menu-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 6px 10px;
  cursor: pointer;
  font-size: 1.1rem;
}

.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 99;
}

@media (max-width: 768px) {
  .mobile-header { display: flex; }
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.25s ease;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .main {
    margin-left: 0;
    padding: 72px 16px 32px;
  }
}

/* Scroll to top */
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 42px;
  height: 42px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--gold);
  font-size: 1.2rem;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  transition: opacity 0.2s;
}
.scroll-top.visible { display: flex; }

/* Bookmark pin */
.ayah-pin {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--text-muted);
  font-family: 'Lora', serif;
  font-size: 0.72rem;
  cursor: pointer;
  padding: 3px 8px;
  margin-left: 8px;
  transition: all 0.15s;
  vertical-align: middle;
}
.ayah-pin:hover { border-color: var(--gold-dim); color: var(--gold); }
.ayah-pin.pinned {
  border-color: var(--gold-dim);
  background: rgba(201,168,76,0.12);
  color: var(--gold);
}

.resume-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: calc(100% - 32px);
  margin: 8px 16px;
  padding: 8px 0;
  background: rgba(201,168,76,0.1);
  border: 1px solid var(--gold-dim);
  border-radius: 8px;
  color: var(--gold);
  font-family: 'Lora', serif;
  font-size: 0.82rem;
  cursor: pointer;
  transition: background 0.15s;
}
.resume-btn:hover { background: rgba(201,168,76,0.18); }
.resume-btn .pin-icon { font-size: 0.95rem; }
</style>
</head>

<div id="fallbackBanner" style="background:#2a2015;border-bottom:1px solid var(--gold-dim);padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:0.85rem;color:var(--text-muted);position:relative;z-index:300">
  Seeing some errors? Go to our static page instead.
  <a href="quran-static.html" style="color:var(--gold);text-decoration:none;border:1px solid var(--gold-dim);border-radius:6px;padding:3px 12px;font-size:0.78rem">Static Version</a>
  <button onclick="document.getElementById('fallbackBanner').remove()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;padding:0 4px;margin-left:8px">&times;</button>
</div>

<div class="mobile-header">
  <h1>القرآن الكريم</h1>
  <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
</div>
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>القرآن الكريم</h1>
      <div style="font-family:'IM Fell English SC',serif;text-align:center;font-size:0.7rem;color:var(--text-muted);margin-bottom:10px;letter-spacing:0.1em">CHRONOLOGICAL ORDER</div>
      <input type="text" class="search-box" id="search" placeholder="Search surah…">
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="meccan">Meccan</button>
        <button class="filter-btn" data-filter="medinan">Medinan</button>
      </div>
    </div>
    <div id="resumeContainer"></div>
    <div class="surah-list" id="surahList"></div>
  </aside>

  <main class="main" id="main">
    <div id="content"></div>
  </main>
</div>

<button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

function getPeriodForRevPos(revPos) {
  if (revPos <= 10) return 'early_meccan_secret';
  if (revPos <= 30) return 'early_meccan_open';
  if (revPos <= 55) return 'mid_meccan';
  if (revPos <= 86) return 'late_meccan';
  if (revPos <= 100) return 'early_medinan';
  return 'late_medinan';
}

const cache = new Map();

// Restore from localStorage
const saved = JSON.parse(localStorage.getItem('quran-prefs') || 'null');
let currentRevIndex = saved?.revIndex ?? 0;
let activeFilter = saved?.filter ?? 'all';
let activeLangs = saved?.langs ?? { arabic: true, transliteration: false, bosnian: false, english: false, turkish: false };
let pinnedAyah = saved?.pinned ?? null; // { surahNum, ayahNum, revIndex, surahName }
let seerahOpen = saved?.seerahOpen ?? false;
let seerahLang = saved?.seerahLang ?? 'en';

function savePrefs() {
  localStorage.setItem('quran-prefs', JSON.stringify({
    revIndex: currentRevIndex,
    filter: activeFilter,
    langs: activeLangs,
    pinned: pinnedAyah,
    seerahOpen,
    seerahLang
  }));
  syncPrefsToServer();
}

function togglePin(surahNum, ayahNum, revIndex, surahName) {
  if (pinnedAyah && pinnedAyah.surahNum === surahNum && pinnedAyah.ayahNum === ayahNum) {
    pinnedAyah = null;
  } else {
    pinnedAyah = { surahNum, ayahNum, revIndex, surahName };
  }
  savePrefs();
  syncBookmarkToServer();
  updatePinButtons();
  renderResumeBtn();
}

function updatePinButtons() {
  document.querySelectorAll('.ayah-pin').forEach(btn => {
    const s = +btn.dataset.surah, a = +btn.dataset.ayah;
    const isPinned = pinnedAyah && pinnedAyah.surahNum === s && pinnedAyah.ayahNum === a;
    btn.classList.toggle('pinned', isPinned);
    btn.innerHTML = isPinned ? '📌 Pinned' : '📌 Pin here';
  });
}

function renderResumeBtn() {
  const container = document.getElementById('resumeContainer');
  if (!pinnedAyah) { container.innerHTML = ''; return; }
  container.innerHTML = `
    <button class="resume-btn" onclick="resumeFromPin()">
      <span class="pin-icon">📌</span>
      Resume — ${pinnedAyah.surahName} : ${pinnedAyah.ayahNum}
    </button>`;
}

async function resumeFromPin() {
  if (!pinnedAyah) return;
  await loadByRevIndex(pinnedAyah.revIndex);
  setTimeout(() => {
    const el = document.querySelector(`.ayah-pin[data-surah="${pinnedAyah.surahNum}"][data-ayah="${pinnedAyah.ayahNum}"]`);
    if (el) el.closest('.ayah').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 300);
}

function getCurrentEntry() { return REVELATION_ORDER[currentRevIndex]; }

function getFilteredList() {
  if (activeFilter === 'all') return REVELATION_ORDER;
  const type = activeFilter === 'meccan' ? 'Meccan' : 'Medinan';
  return REVELATION_ORDER.filter(e => e[3] === type);
}

// Build sidebar
function buildSidebar() {
  const list = document.getElementById('surahList');
  list.innerHTML = '';
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = getFilteredList();
  const currentSurahNum = getCurrentEntry()[1];

  filtered.forEach(entry => {
    const [revPos, surahNum, name, type] = entry;
    const nameAr = ARABIC_NAMES[surahNum];
    if (q && !name.toLowerCase().includes(q) && !nameAr.includes(q) && !String(surahNum).includes(q)) return;

    const div = document.createElement('div');
    div.className = 'surah-item' + (surahNum === currentSurahNum ? ' active' : '');
    div.innerHTML = `
      <span class="surah-num">${revPos}</span>
      <div class="surah-info">
        <div class="surah-name-ar">${nameAr}</div>
        <div class="surah-name-en">${name}</div>
      </div>
      <span class="surah-mushaf-num">${surahNum}</span>
      <span class="surah-type-dot ${type.toLowerCase()}"></span>
    `;
    div.onclick = () => {
      const idx = REVELATION_ORDER.indexOf(entry);
      loadByRevIndex(idx);
    };
    list.appendChild(div);
  });
}

// Loading skeleton

  const content = document.getElementById('content');

// API base — uses Go backend when served from it, falls back to alquran.cloud
const API_BASE = '/api';

// Fetch surah (all 5 editions) via Go proxy or direct
async function fetchSurah(num) {
  if (cache.has(num)) return cache.get(num);

  let resp;
  try {
    resp = await fetch(`${API_BASE}/surah/${num}`);
  } catch {
    // Fallback to direct API if backend is unreachable
    resp = await fetch(`https://api.alquran.cloud/v1/surah/${num}/editions/quran-uthmani,en.transliteration,en.sahih,bs.mlivo,tr.diyanet`);
  }
  if (!resp.ok) throw new Error('Failed to fetch surah');
  const json = await resp.json();
  const data = {
    arabic: json.data[0],
    transliteration: json.data[1],
    english: json.data[2],
    bosnian: json.data[3],
    turkish: json.data[4]
  };
  cache.set(num, data);
  return data;
}

// Sync preferences to server (fire-and-forget)
function syncPrefsToServer() {
  const prefs = {
    revIndex: currentRevIndex,
    filter: activeFilter,
    langs: activeLangs,
    seerahOpen,
    seerahLang
  };
  fetch(`${API_BASE}/prefs`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify(prefs)
  }).catch(() => {}); // silent fail
}

// Sync bookmark to server
function syncBookmarkToServer() {
  if (pinnedAyah) {
    fetch(`${API_BASE}/bookmark`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(pinnedAyah)
    }).catch(() => {});
  } else {
    fetch(`${API_BASE}/bookmark`, {
      method: 'DELETE',
      credentials: 'include'
    }).catch(() => {});
  }
}

// Load prefs from server on startup (merges with localStorage)
async function loadServerPrefs() {
  try {
    const resp = await fetch(`${API_BASE}/prefs`, { credentials: 'include' });
    if (resp.ok) {
      const p = await resp.json();
      if (p && p.revIndex !== undefined) {
        currentRevIndex = p.revIndex;
        activeFilter = p.filter || 'all';
        activeLangs = p.langs || activeLangs;
        seerahOpen = p.seerahOpen || false;
        seerahLang = p.seerahLang || 'en';
        savePrefs();
      }
    }
  } catch {
    // Server not available, use localStorage
  }

  try {
    const resp = await fetch(`${API_BASE}/bookmark`, { credentials: 'include' });
    if (resp.ok) {
      const b = await resp.json();
      if (b && b.surahNum) {
        pinnedAyah = b;
        savePrefs();
      }
    }
  } catch {}
}

function seerahPanelHTML(surahNum, revPos) {

  const data = (typeof SEERAH_DATA !== 'undefined') ? SEERAH_DATA[surahNum] : null;
  if (!period) return '';

  const isEn = seerahLang === 'en';
  const periodTitle = isEn ? period.title : period.titleBs;
  const periodSummary = isEn ? period.summary : period.summaryBs;
  const story = data ? (isEn ? data.story : data.storyBs) : '';
  const events = data ? (data.keyEvents || []) : [];
  const ref = data ? data.ref : '';

  let body = '';
  body += `<div class="seerah-period-title">${periodTitle}</div>`;
  if (period.yearRange) body += `<div class="seerah-period-years">${period.yearRange}</div>`;
  body += `<div class="seerah-lang-btns">
    <button class="seerah-lang-btn ${seerahLang==='en'?'active':''}" onclick="switchSeerahLang('en')">EN</button>
    <button class="seerah-lang-btn ${seerahLang==='bs'?'active':''}" onclick="switchSeerahLang('bs')">BS</button>
  </div>`;
  body += `<div class="seerah-text period-summary">${periodSummary}</div>`;
  if (story) body += `<div class="seerah-text">${story}</div>`;
  if (events.length) {
    body += '<ul class="seerah-events">' + events.map(e => `<li>${e}</li>`).join('') + '</ul>';
  }
  body += `<a class="seerah-ref" href="https://d1.islamhouse.com/data/bs/ih_books/single/bs_Zapecaceni_dzennetski_napitak.pdf" target="_blank" rel="noopener">Read full chapter in The Sealed Nectar (PDF)${ref ? ' — ' + ref : ''}</a>`;

  return `<div class="seerah-panel">
    <div class="seerah-toggle" onclick="toggleSeerah()">
      <span class="seerah-toggle-icon ${seerahOpen?'rotated':''}">&#9654;</span>
      <span class="seerah-toggle-title">Story of this Revelation</span>
      <span class="seerah-toggle-period">${period.yearRange || ''}</span>
    </div>
    <div class="seerah-body ${seerahOpen?'expanded':''}">
      <div class="seerah-content">${body}</div>
    </div>
  </div>`;
}

function toggleSeerah() {
  const body = document.querySelector('.seerah-body');
  const icon = document.querySelector('.seerah-toggle-icon');
  if (!body) return;
  seerahOpen = !seerahOpen;
  body.classList.toggle('expanded', seerahOpen);
  if (icon) icon.classList.toggle('rotated', seerahOpen);
  savePrefs();
}

function switchSeerahLang(lang) {
  seerahLang = lang;
  savePrefs();
  loadByRevIndex(currentRevIndex);
}

// Render surah
async function loadByRevIndex(idx) {
  currentRevIndex = idx;
  savePrefs();
  const entry = REVELATION_ORDER[idx];
  const [revPos, surahNum, name, type, notes] = entry;
  const nameAr = ARABIC_NAMES[surahNum];

  buildSidebar();
  showLoading();
  window.scrollTo({ top: 0 });

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');

  try {
    const data = await fetchSurah(surahNum);
    const content = document.getElementById('content');
    const typeClass = type.toLowerCase();
    const ayahCount = data.arabic.ayahs.length;

    let html = langTogglesHTML();

    html += `
      <div class="surah-header">
        <div class="surah-header-label">Revelation #${revPos}</div>
        <div class="surah-header-ar">${nameAr}</div>
        <div class="surah-header-en">${name}</div>
        <div class="surah-meta">
          <span class="surah-badge ${typeClass}">${type}</span>
          <span>Surah ${surahNum}</span>
          <span>${ayahCount} ayahs</span>
        </div>
      </div>
    `;

    if (notes) {
      html += `<div class="notes-banner">${notes}</div>`;
    }

    html += seerahPanelHTML(surahNum, revPos);

    if (surahNum !== 9 && surahNum !== 1) {
      html += '<div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>';
    }

    const ar = data.arabic.ayahs;
    const tl = data.transliteration.ayahs;
    const en = data.english.ayahs;
    const bs = data.bosnian.ayahs;
    const tr = data.turkish.ayahs;

    for (let i = 0; i < ar.length; i++) {
      const isPinned = pinnedAyah && pinnedAyah.surahNum === surahNum && pinnedAyah.ayahNum === ar[i].numberInSurah;
      html += `<div class="ayah">
        <div class="ayah-num-badge">${ar[i].numberInSurah}</div>
        <button class="ayah-pin ${isPinned ? 'pinned' : ''}" data-surah="${surahNum}" data-ayah="${ar[i].numberInSurah}" onclick="togglePin(${surahNum},${ar[i].numberInSurah},${idx},'${name.replace(/'/g, "\\'")}')">${isPinned ? '📌 Pinned' : '📌 Pin here'}</button>
        <div class="ayah-arabic" ${activeLangs.arabic ? '' : 'style="display:none"'}>${ar[i].text}</div>
        <div class="ayah-transliteration" data-lang="transliteration" ${activeLangs.transliteration ? '' : 'style="display:none"'}>${tl[i].text}</div>
        <div class="ayah-translation" data-lang="bosnian" ${activeLangs.bosnian ? '' : 'style="display:none"'}><span class="lang-label">Bosnian</span>${bs[i].text}</div>
        <div class="ayah-translation" data-lang="english" ${activeLangs.english ? '' : 'style="display:none"'}><span class="lang-label">English</span>${en[i].text}</div>
        <div class="ayah-translation" data-lang="turkish" ${activeLangs.turkish ? '' : 'style="display:none"'}><span class="lang-label">Turkish</span>${tr[i].text}</div>
      </div>`;
    }

    // Prev / Next in revelation order
    const prev = idx > 0 ? idx - 1 : null;
    const next = idx < 113 ? idx + 1 : null;
    html += `
      <div class="nav-buttons">
        <button class="nav-btn" ${prev !== null ? `onclick="loadByRevIndex(${prev})"` : 'disabled'}>\u2190 ${prev !== null ? REVELATION_ORDER[prev][2] : ''}</button>
        <button class="nav-btn" ${next !== null ? `onclick="loadByRevIndex(${next})"` : 'disabled'}>${next !== null ? REVELATION_ORDER[next][2] : ''} \u2192</button>
      </div>
    `;

    content.innerHTML = html;
    bindLangToggles();
  } catch (err) {
    document.getElementById('content').innerHTML = `
      <div style="text-align:center;padding:60px 20px;color:var(--text-muted)">
        <p style="font-size:1.2rem;margin-bottom:12px">Failed to load surah</p>
        <p style="font-size:0.85rem">${err.message}</p>
        <button class="nav-btn" style="margin-top:20px" onclick="loadByRevIndex(${idx})">Retry</button>
      </div>
    `;
  }
}

// Language toggle logic
function bindLangToggles() {
  document.querySelectorAll('.lang-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.dataset.lang;
      const activeCount = Object.values(activeLangs).filter(Boolean).length;
      // Don't allow disabling the last active language
      if (activeLangs[lang] && activeCount <= 1) return;
      activeLangs[lang] = !activeLangs[lang];
      savePrefs();
      btn.classList.toggle('active', activeLangs[lang]);

      // Toggle visibility
      if (lang === 'arabic') {
        document.querySelectorAll('.ayah-arabic').forEach(el => el.style.display = activeLangs.arabic ? '' : 'none');
      } else if (lang === 'transliteration') {
        document.querySelectorAll('.ayah-transliteration').forEach(el => el.style.display = activeLangs.transliteration ? '' : 'none');
      } else {
        document.querySelectorAll(`.ayah-translation[data-lang="${lang}"]`).forEach(el => el.style.display = activeLangs[lang] ? '' : 'none');
      }
    });
  });
}

// Search
document.getElementById('search').addEventListener('input', () => buildSidebar());

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    savePrefs();
    buildSidebar();
  });
});

// Mobile sidebar toggle
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

// Scroll to top button
window.addEventListener('scroll', () => {
  document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 400);
});

// Init — try server prefs first, then fall back to localStorage
(async function init() {
  await loadServerPrefs();

  if (activeFilter !== 'all') {
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.filter === activeFilter);
    });
  }
  buildSidebar();
  renderResumeBtn();
  loadByRevIndex(currentRevIndex);
})();
</script>
</body>
</html>
